<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PostBridge Korea — OAuth 콜백</title>
<style>
  body { font-family: -apple-system, "맑은 고딕", sans-serif; background:#111; color:#eee; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { text-align:center; padding:2rem; max-width:600px; }
  .code { background:#222; border:1px solid #444; border-radius:8px; padding:1rem; font-size:1.2rem; word-break:break-all; margin:1rem 0; user-select:all; }
  button { background:#3897f0; color:#fff; border:none; padding:0.6rem 1.2rem; border-radius:6px; font-size:1rem; cursor:pointer; }
  .err { color:#f66; }
</style>
</head>
<body>
<div class="box">
  <h2>인증 완료</h2>
  <p id="msg">아래 코드를 복사해서 터미널에 붙여넣어 주세요.</p>
  <div class="code" id="code">-</div>
  <button onclick="copyCode()">코드 복사</button>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const error = params.get("error_description") || params.get("error");
  const codeEl = document.getElementById("code");
  const msgEl = document.getElementById("msg");
  if (code) {
    codeEl.textContent = code;
  } else if (error) {
    msgEl.className = "err";
    msgEl.textContent = "인증 실패: " + error;
    codeEl.textContent = "-";
  } else {
    codeEl.textContent = "(코드 없음)";
  }
  function copyCode() {
    if (code) navigator.clipboard.writeText(code);
  }
</script>
</body>
</html>
